reproducibility: True
show_progress: True
log_wandb: True
wandb_project: 'MAPLE_Project'
#
data_path: './dataset/'

#dataset: 'ml-1m'
#USER_ID_FIELD: user_id
#ITEM_ID_FIELD: item_id
#TIME_FIELD: timestamp
#RATING_FIELD: rating
#load_col:
#  inter: [user_id, item_id, rating, timestamp]
#MAX_ITEM_LIST_LENGTH: 200


#dataset: amazon-beauty
#dataset: Amazon_Video_Games
dataset: Amazon_Toys_and_Games
MAX_ITEM_LIST_LENGTH: 50
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
RATING_FIELD: rating
TIME_FIELD: timestamp
load_col:
  inter: [user_id, item_id, rating, timestamp]
user_inter_num_interval: "[5,inf)"
item_inter_num_interval: "[5,inf)"


eval_args:
  order: TO
  split: {'LS': 'valid_and_test'}
  mode: full


# MAPLE
hidden_size: 64
mamba_d_state: 32
dropout_prob: 0.4
num_layers: 2
ffn_dropout_prob: 0.5
d_conv: 4
expand: 2
short_seq_len_ratio: 0.8
num_proto_long: 30            # Number of long-term prototypes K_L
num_proto_short: 15            # Number of short-term prototypes K_S
tau_proxy: 0.3
tau_nce: 0.5
lambda_align: 0.1    # modal_contrast_loss
lambda_decor: 0.2   # modal_decorrelation_loss
ema_alpha: 0.95
injection_weight: 0.1


# GRU4Rec
#embedding_size: 64              # (int) The embedding size of items.
#hidden_size: 128                # (int) The number of features in the hidden state.
#num_layers: 2                   # (int) The number of layers in GRU.
#dropout_prob: 0.3               # (float) The dropout rate.


# BERT4Rec
#n_layers: 2                     # (int) The number of transformer layers in transformer encoder.
#n_heads: 4                      # (int) The number of attention heads for multi-head attention layer.
#hidden_size: 64                 # (int) The number of features in the hidden state.
#inner_size: 256                 # (int) The inner hidden size in feed-forward layer.
#hidden_dropout_prob: 0.3        # (float) The probability of an element to be zeroed.
#attn_dropout_prob: 0.3         # (float) The probability of an attention score to be zeroed.
#hidden_act: 'gelu'              # (str) The activation function in feed-forward layer.
#layer_norm_eps: 1e-12           # (float) A value added to the denominator for numerical stability.
#initializer_range: 0.02         # (float) The standard deviation for normal initialization.
#mask_ratio: 0.25                 # (float) The probability for a item replaced by MASK token.
#transform: mask_itemseq         # (str) The transform operation for batch data process.
#ft_ratio: 0.5                   # (float) The probability of generating fine-tuning samples


# SASRec
#n_layers: 2                     # (int) The number of transformer layers in transformer encoder.
#n_heads: 8                      # (int) The number of attention heads for multi-head attention layer.
#hidden_size: 64                 # (int) The number of features in the hidden state.
#inner_size: 256                 # (int) The inner hidden size in feed-forward layer.
#hidden_dropout_prob: 0.3        # (float) The probability of an element to be zeroed.
#attn_dropout_prob: 0.3          # (float) The probability of an attention score to be zeroed.
#hidden_act: 'gelu'              # (str) The activation function in feed-forward layer.
#layer_norm_eps: 1e-12           # (float) A value added to the denominator for numerical stability.
#initializer_range: 0.02         # (float) The standard deviation for normal initialization.


# FEARec
#n_layers: 3                      # (int) The number of transformer layers in transformer encoder.
#n_heads: 2                       # (int) The number of attention heads for multi-head attention layer.
#hidden_size: 64                  # (int) The number of features in the hidden state
#inner_size: 256                  # (int) The inner hidden size in feed-forward layer.
#hidden_dropout_prob: 0.3         # (float) The probability of an element to be zeroed.
#attn_dropout_prob: 0.3          # (float) The probability of an attention score to be zeroed.
#hidden_act: 'gelu'               # (str) The activation function in feed-forward layer.
#layer_norm_eps: 1e-12            # (float) A value added to the denominator for numerical stability.
#initializer_range: 0.02          # (float) The standard deviation for normal initialization.
#lmd: 0.1                         # (float) The weight of unsupervised normalized CE loss.
#lmd_sem: 0.1                    # (float) The weight of supervised normalized CE loss.
#global_ratio: 0.5

loss_type: 'CE'
train_neg_sample_args: ~  # CE

# Training configuration
epochs: 300
train_batch_size: 1024
eval_batch_size: 1024
learning_rate: 0.001

use_gpu: True
gpu_id: '0'

# evalution settings
metrics: ['Hit', 'NDCG', 'MRR']
valid_metric: NDCG@10
topk: [10]
metric_decimal_place: 4
weight_decay: 0.0
